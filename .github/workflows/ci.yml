name: CI

permissions:
  contents: write
  packages: read
  pull-requests: write

on:
  push:
    branches:
      - master
  pull_request: null

jobs:
  test:
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-python.yml@6fa34cbd117d43f8770d30f1d37339287b654389 # v13.17.0
    with:
      python-version: '3.14'
      min-coverage: 70

  security:
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-security.yml@6fa34cbd117d43f8770d30f1d37339287b654389 # v13.17.0
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  check:
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-conventional-commits.yml@6fa34cbd117d43f8770d30f1d37339287b654389 # v13.17.0

  black:
    permissions:
      contents: write
      pull-requests: write
      checks: write
      issues: write
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-lint-black.yml@6fa34cbd117d43f8770d30f1d37339287b654389 # v13.17.0
    with:
      head-repository: ${{ github.event.pull_request.head.repo.full_name || '' }}

  release-gate:
    needs:
      - security
      - test
      - check
    permissions:
      contents: write
      id-token: write
    uses: NLDCSC/DCSC-shared/.github/workflows/release-gate.yml@6fa34cbd117d43f8770d30f1d37339287b654389 # v13.17.0
    with:
      python-version: '3.14'
    secrets:
      releaser-client-id: ${{ secrets.RELEASER_CLIENT_ID }}
      releaser-app-private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

  release-python:
    permissions:
      contents: write
      id-token: write
    uses: NLDCSC/DCSC-shared/.github/workflows/release-python.yml@6fa34cbd117d43f8770d30f1d37339287b654389 # v13.17.0
    with:
      python-version: '3.14'
      publish-to-pypi: true
