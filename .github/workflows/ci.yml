name: CI

permissions:
  contents: write
  packages: read
  pull-requests: write

on:
  push:
    branches:
      - master
  pull_request: null

jobs:
  test:
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-python.yml@0a23704020baa5941959aae6a7588de170f84378 # v13.20.2
    with:
      python-version: '3.14'
      min-coverage: 70

  security:
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-security.yml@0a23704020baa5941959aae6a7588de170f84378 # v13.20.2
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  check:
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-conventional-commits.yml@0a23704020baa5941959aae6a7588de170f84378 # v13.20.2

  black:
    permissions:
      contents: write
      pull-requests: write
      checks: write
      issues: write
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-lint-black.yml@0a23704020baa5941959aae6a7588de170f84378 # v13.20.2
    with:
      head-repository: ${{ github.event.pull_request.head.repo.full_name || '' }}

  release-gate:
    needs:
      - security
      - test
      - check
    permissions:
      contents: write
      id-token: write
    uses: NLDCSC/DCSC-shared/.github/workflows/release-gate.yml@0a23704020baa5941959aae6a7588de170f84378 # v13.20.2
    with:
      python-version: '3.14'
    secrets:
      releaser-client-id: ${{ secrets.RELEASER_CLIENT_ID }}
      releaser-app-private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

  release-python:
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    uses: NLDCSC/DCSC-shared/.github/workflows/release-python.yml@0a23704020baa5941959aae6a7588de170f84378 # v13.20.2
    with:
      python-version: '3.14'
      publish-to-pypi: true

  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: NLDCSC/DCSC-shared/.github/workflows/deploy-docs-pages.yml@0a23704020baa5941959aae6a7588de170f84378 # v13.20.2
    with:
      python-version: '3.14'
      poetry-version: 2.5.1
      install-command: poetry install --only docs
      build-command: poetry run make -C docs html
      artifact-path: docs/build/html
