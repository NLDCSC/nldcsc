---
name: Mutation Testing

on:
  pull_request:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libldap2-dev libsasl2-dev libssl-dev libmariadb-dev-compat libmariadb-dev
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
      - name: Run mutation testing
        # Report-only: mutmut exits 0 regardless of survived mutants, so this
        # never blocks the PR. Scope of what gets mutated lives in
        # pyproject.toml [tool.mutmut].
        run: tox -e mutmut
      - name: Summarize mutation score
        if: always()
        run: python3 .github/scripts/mutmut_summary.py
