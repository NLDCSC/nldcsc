---
name: Verify Release Version

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  verify:
    name: Verify release version is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.10'

      - name: Install commitizen
        run: |
          python -m pip install --upgrade pip
          pip install commitizen

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Check commits are conventional
        run: cz check --rev-range origin/${{ github.event.pull_request.base.ref }}..HEAD

      - name: Check next version is computable
        run: |
          cz bump --get-next || {
            code=$?
            if [ "$code" -eq 21 ]; then
              echo "No bump-worthy commits yet; nothing to verify."
              exit 0
            fi
            exit "$code"
          }
